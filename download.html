    <title>تحضير رابط التحميل - إديوكيشن بازار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .download-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 8px solid #1abc9c;
        }

        .ad-placeholder {
            width: 100%;
            height: 100px;
            background: #eee;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border: 1px dashed #ccc;
        }

        #timer {
            font-size: 4rem;
            font-weight: bold;
            color: #f5576c;
            margin: 20px 0;
        }

        .loading-text {
            color: #555;
            font-size: 1.2rem;
        }

        .btn-ready {
            display: none;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(26, 188, 156, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .audio-promo {
            margin-top: 25px;
            padding: 15px;
            background: #fdf2f2;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #333;
        }
    </style>
</head>

        <a id="download-link" href="#" class="btn-ready">اضغط هنا للتحميل الآن</a>

        <div class="audio-promo">
            <strong>هل سمعت الشرح الصوتي؟</strong>
            <p>يمكنك الاستماع لملخص الدرس المسجل باحترافية أثناء انتظار الرابط.</p>

    </div>

    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});

        // نظام العداد وتمرير الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const destination = urlParams.get('url');
        const timerText = document.getElementById('timer');
        const downloadBtn = document.getElementById('download-link');

        let seconds = 15;
        const interval = setInterval(() => {
            seconds--;
            timerText.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                timerText.style.display = 'none';
                downloadBtn.style.display = 'inline-block';
                downloadBtn.href = destination;
            }
        }, 1000);
    </script>
