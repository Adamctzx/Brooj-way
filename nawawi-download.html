    // ==========================================
    // الدوال البرمجية (لا تحتاج لتعديلها)
    // ==========================================
    function showLessons(groupName, hadiths) {
        const container = document.getElementById('lessonsContainer');
        document.getElementById('modalTitle').innerText = groupName;
        container.innerHTML = '';

        if (hadiths.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">جاري تجهيز بقية الأحاديث...</p>';
        } else {
            hadiths.forEach(hadith => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.innerHTML = `
                    <span class="lesson-title-main">${hadith.titleAr}</span>
                    <div class="download-row">
                        <a href="download.html?url=${encodeURIComponent(hadith.linkAr)}" class="download-box ar-box">
                            <span class="lang-label ar-label">العربية</span>
                            <span class="lesson-name">تحميل العرض</span>
                        </a>
                        <a href="download.html?url=${encodeURIComponent(hadith.linkEn)}" class="download-box en-box" dir="ltr">
                            <span class="lang-label en-label">English</span>
                            <span class="lesson-name">Download PPT</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        document.getElementById('lessonModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('lessonModal').style.display = 'none'; }
    window.onclick = function(event) { if (event.target.className === 'modal') closeModal(); }
</script>
