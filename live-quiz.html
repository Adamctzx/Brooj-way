        /* 🔴 تصميم الأزرار ثلاثية الأبعاد الملموسة + توحيد الحجم لمنع الغش 🔴 */
        .option-btn { 
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 15px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0px rgba(0,0,0,0.3);

        @keyframes floatUpFade { 0% { opacity: 0; transform: translateY(20px) scale(0.8); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 30% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; transform: translateY(-40px); } 100% { opacity: 0; transform: translateY(-60px); } }
        .floating-emoji { background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; animation: floatUpFade 3.5s forwards; display: inline-flex; align-items: center; gap: 8px; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: fit-content; }

        @keyframes shake { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-55%, -50%); } 75% { transform: translate(-45%, -50%); } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, onSnapshot, getDoc, addDoc, collection, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAQLfeZ232YVe6oY1omNOyrA_FzbNu8c_U",
            authDomain: "education-bazaar-ee0a5.firebaseapp.com",
            projectId: "education-bazaar-ee0a5",
            storageBucket: "education-bazaar-ee0a5.firebasestorage.app",
            messagingSenderId: "737041495961",
            appId: "1:737041495961:web:ae22fc0aaff4f1f9ff8508"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        const myUid = sessionStorage.getItem('myUid');
        const myName = sessionStorage.getItem('myName');
        const myAvatar = sessionStorage.getItem('myAvatar') || '👤'; 
        
        let quizzes = []; 
        let currentQIdx = -1;
        let myScore = 0;
        let hasAnswered = false;
        let isHost = false;
        let gameMode = '1v1';
        let opponentUid = null;
        let isTransitioning = false;
        
        let questionTimerInterval; 
        let lastSeenMessageTime = 0;
        let currentStreak = 0; 

        const soundCorrect = new Audio('https://www.myinstants.com/media/sounds/stadium-cheer.mp3');
        const soundWrong = new Audio('https://www.myinstants.com/media/sounds/crowd-groan.mp3');        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if(type === 'correct') { 
                soundCorrect.currentTime = 0; 
                let playPromise = soundCorrect.play();
                if (playPromise !== undefined) playPromise.catch(e => console.log(e));
                setTimeout(() => { soundCorrect.pause(); soundCorrect.currentTime = 0; }, 2000);
            } else if(type === 'wrong') { 
                soundWrong.currentTime = 0;
                let playPromise = soundWrong.play();
                if (playPromise !== undefined) playPromise.catch(e => console.log(e));
                setTimeout(() => { soundWrong.pause(); soundWrong.currentTime = 0; }, 1500);
            } else if(type === 'tick') { 
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode); 
                gainNode.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); 
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        async function postToFeed(msg) {
            try { await addDoc(collection(db, "global_feed"), { message: msg, createdAt: new Date() }); } 
            catch(e) { console.error("Feed error: ", e); }
        }

        const emojiBtn = document.getElementById('emoji-toggle-btn');
        const emojiPanel = document.getElementById('emoji-panel');
        emojiBtn.onclick = () => emojiPanel.classList.toggle('closed');
        document.addEventListener('click', (e) => {
            if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) emojiPanel.classList.add('closed');
        });

        document.querySelectorAll('.action-msg').forEach(btn => {
            btn.onclick = async () => {
                const msgContent = btn.textContent;
                emojiPanel.classList.add('closed');
                try {
                    await updateDoc(doc(db, 'rooms', roomId), {
                        lastLiveMessage: { uid: myUid, name: myName, text: msgContent, time: Date.now() }
                    });
                } catch(e) { console.log("خطأ في الإرسال"); }
            };
        });

        function showFloatingMessage(senderName, text) {
            const container = document.getElementById('live-emojis-container');
            const bubble = document.createElement('div');
            bubble.className = 'floating-emoji';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'sender-name';
            nameSpan.textContent = senderName + ": ";
            const messageText = document.createTextNode(" " + text.substring(0, 50)); 
            bubble.appendChild(nameSpan);
            bubble.appendChild(messageText);
            container.appendChild(bubble);
            setTimeout(() => { if (container.contains(bubble)) container.removeChild(bubble); }, 3500);
        }

        function getTeamHtml(teamData, size) {
            if (!teamData) return '';
            if (teamData.startsWith('http')) {
                return `<img src="${teamData}" style="width:${size}px; height:${size}px; object-fit:contain; vertical-align:middle; background:#fff; border-radius:4px; padding:1px; margin-left:5px;">`;
            } else {
                return `<span style="margin-left:5px; font-size:${size === 20 ? '1.2rem' : '1.5rem'}; vertical-align:middle;">${teamData}</span>`;
            }
        }

        async function initBattle() {
            try {
                const roomRef = doc(db, 'rooms', roomId);
                const roomSnap = await getDoc(roomRef);
                if (!roomSnap.exists()) { window.location.href = 'lobby.html'; return; }
                
                const roomData = roomSnap.data();
                isHost = roomData.hostUid === myUid;
                gameMode = roomData.mode || '1v1';
                window.lessonTitleForMsg = roomData.lessonId;

                if (roomData.lessonId) {
                    const bankSnap = await getDoc(doc(db, 'question_banks', roomData.lessonId));
                    if (bankSnap.exists() && bankSnap.data().questions) {
                        quizzes = bankSnap.data().questions.map(q => ({
                            ar: q.textAr, en: q.textEn,
                            options: q.options.map((opt, idx) => ({ ar: opt.ar, en: opt.en, correct: idx === q.correctAnswerIndex }))
                        }));
                    } else {
                        alert("لا توجد أسئلة مسجلة لهذا الدرس في بنك الأسئلة!"); 
                        window.location.href = 'lobby.html'; 
                        return;
                    }
                }

                if (isHost && gameMode === 'group') {
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    document.getElementById('timer-text').style.display = 'none';
                    document.getElementById('timer-container').style.display = 'none';
                    document.getElementById('question-container').style.display = 'none';
                    document.getElementById('emoji-toggle-btn').style.display = 'none';
                } else {
                    if(gameMode === 'single') document.getElementById('ui-single').classList.remove('hidden');
                    else if(gameMode === '1v1' || gameMode === 'matchmaking') document.getElementById('ui-1v1').classList.remove('hidden');
                    else document.getElementById('ui-group').classList.remove('hidden');
                }

                onSnapshot(roomRef, (docSnap) => {
                    const data = docSnap.data();
                    if (!data) return;
                    const playersKeys = Object.keys(data.players || {});

                    if (data.players && !data.players[myUid] && !(isHost && gameMode==='group')) {
                        alert("لقد تم استبعادك من التحدي بواسطة المعلم.");
                        window.location.href = 'lobby.html';
                        return;
                    }

                    if (data.lastWarning && data.lastWarning.targetUid === myUid && data.lastWarning.time > (sessionStorage.getItem('lastWarn') || 0)) {
                        const overlay = document.getElementById('warning-overlay');
                        overlay.style.display = 'block';
                        setTimeout(() => overlay.style.display = 'none', 4000);
                        sessionStorage.setItem('lastWarn', data.lastWarning.time);
                        playSound('wrong');
                    }

                    if (isHost && gameMode === 'group') {
                        const table = document.getElementById('admin-student-table');
                        table.innerHTML = '';
                        Object.values(data.players || {}).forEach(p => {
                            if(p.uid === myUid) return; 
                            const pTeamStrTable = getTeamHtml(p.team, 20);
                            table.innerHTML += `<tr>
                                <td>${pTeamStrTable} ${p.avatar || '👤'} ${p.displayName}</td>
                                <td><span style="color:#fdbb2d; font-weight:bold;">${p.score || 0}</span></td>
                                <td>
                                    <button class="btn-warn" onclick="warnStudent('${p.uid}')">⚠️ تحذير</button>
                                    <button class="btn-kick" onclick="kickStudent('${p.uid}')">❌ طرد</button>
                                </td>
                            </tr>`;
                        });
                    }
                    
                    if (data.lastLiveMessage && data.lastLiveMessage.time > lastSeenMessageTime) {
                        lastSeenMessageTime = data.lastLiveMessage.time;
                        if (data.lastLiveMessage.uid !== myUid || gameMode === 'single') {
                            showFloatingMessage(data.lastLiveMessage.name, data.lastLiveMessage.text);
                        }
                    }

                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('quiz-screen').classList.remove('hidden');

                    if (gameMode === 'single') {
                        const myTeamStr = getTeamHtml(data.players[myUid] && data.players[myUid].team, 25);
                        document.getElementById('single-name').innerHTML = `${myTeamStr} ${data.players[myUid].avatar || '👤'} ${myName}`;
                        document.getElementById('single-score').textContent = (data.players && data.players[myUid] ? data.players[myUid].score : 0);
                    } else if (gameMode === '1v1' || gameMode === 'matchmaking') {
                        opponentUid = playersKeys.find(id => id !== myUid) || null;
                        
                        const myTeamStr = getTeamHtml(data.players[myUid] && data.players[myUid].team, 25);
                        document.getElementById('my-name').innerHTML = `${myTeamStr} ${data.players[myUid].avatar || '👤'} ${myName}`;
                        document.getElementById('my-score').textContent = (data.players && data.players[myUid] ? data.players[myUid].score : 0);
                        
                        if(opponentUid && data.players[opponentUid]) {
                            const oppTeamStr = getTeamHtml(data.players[opponentUid] && data.players[opponentUid].team, 25);
                            document.getElementById('opponent-name').innerHTML = `${oppTeamStr} ${data.players[opponentUid].avatar || '👤'} ${data.players[opponentUid].displayName}`;
                            document.getElementById('opponent-score').textContent = data.players[opponentUid].score || 0;
                        }
                    } else {
                        const playersArray = Object.values(data.players || {}).sort((a,b) => b.score - a.score);
                        const uiGroup = document.getElementById('ui-group');
                        uiGroup.innerHTML = '';
                        playersArray.forEach(p => {
                            if(p.uid === myUid && isHost) return; 
                            const isMe = p.uid === myUid;
                            const pTeamStr = getTeamHtml(p.team, 20);
                            uiGroup.innerHTML += `<div class="player-badge ${isMe ? 'me' : ''}"><span>${pTeamStr} ${p.avatar || '👤'} ${p.displayName}</span><span class="score">${p.score || 0}</span></div>`;
                        });
                    }

                    const roomQIdx = data.currentQuestionIndex || 0;
                    if(roomQIdx >= quizzes.length) { endGame(data); return; }

                    if(currentQIdx !== roomQIdx) {
                        currentQIdx = roomQIdx;
                        hasAnswered = false;
                        isTransitioning = false;
                        document.getElementById('waiting-opponent').classList.add('hidden');
                        renderQuestion(quizzes[currentQIdx], currentQIdx);
                    }

                    if (gameMode === 'single') {
                        const myAns = data.players && data.players[myUid] && data.players[myUid].answers && data.players[myUid].answers[`q_${roomQIdx}`];
                        if(myAns && !isTransitioning) {
                            isTransitioning = true; 
                            document.getElementById('waiting-opponent').innerHTML = "✅ جاري الانتقال للسؤال التالي...";
                            setTimeout(() => updateDoc(roomRef, { currentQuestionIndex: roomQIdx + 1 }), 2000);
                        }
                    }

                    if ((gameMode === '1v1' || gameMode === 'matchmaking') && opponentUid) {
                        const myAns = data.players && data.players[myUid] && data.players[myUid].answers && data.players[myUid].answers[`q_${roomQIdx}`];
                        const oppAns = data.players && data.players[opponentUid] && data.players[opponentUid].answers && data.players[opponentUid].answers[`q_${roomQIdx}`];
                        if(myAns && oppAns && !isTransitioning) {
                            isTransitioning = true; 
                            document.getElementById('waiting-opponent').innerHTML = "✅ اكتملت الإجابات! جاري الانتقال...";
                            if(isHost) setTimeout(() => updateDoc(roomRef, { currentQuestionIndex: roomQIdx + 1 }), 2500);
                        }
                    }
                });

            } catch (error) { 
                console.error(error); 
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('loading-text').innerHTML = `<span style="color:#e74c3c;">توقف التحميل بسبب خطأ تقني:</span> <br><br><small style="font-size:1rem;">${error.message}</small> <br><br><button onclick="window.location.href='lobby.html'" style="padding:10px 20px; background:#f1c40f; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">العودة للوبي</button>`;
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 🔴 دالة عرض السؤال مع نظام الغمامة (وقت القراءة الإجباري) 🔴
        function renderQuestion(q, idx) {
            if (isHost && gameMode === 'group') return; 

            document.getElementById('question-indicator').textContent = `سؤال ${idx + 1} من ${quizzes.length}`;
            document.getElementById('q-text-ar').textContent = q.ar;
            document.getElementById('q-text-en').textContent = q.en;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const shuffledOptions = shuffleArray([...q.options]);

            let timeLeft = 20; // إجمالي وقت السؤال
            let readingTime = 7; // وقت القراءة الإجباري (الغمامة)
            let canClick = false;

            const timerText = document.getElementById('timer-text');
            const timerBar = document.getElementById('timer-bar');
            
            timerText.textContent = `⏳ ${timeLeft} ثانية`;
            timerBar.style.width = '100%';
            timerBar.style.background = '#2ecc71';

            // إظهار رسالة وقت القراءة
            const waitMsg = document.getElementById('waiting-opponent');
            waitMsg.classList.remove('hidden');
            waitMsg.style.color = "#fdbb2d";
            waitMsg.innerHTML = `⏳ اقرأ السؤال بتركيز... ستظهر الإجابات بعد <span id="read-timer" style="font-size:1.6rem; font-weight:bold; color:#fff;">${readingTime}</span> ثوانٍ`;

            clearInterval(questionTimerInterval); 
            
            const buttons = [];
            
            // إنشاء الأزرار وإخفائها في البداية
            shuffledOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.correct = opt.correct;
                
                btn.innerHTML = `<span>${opt.ar}</span> <br><small style="color:#ccc;">${opt.en}</small>`;
                
                // الغمامة (إخفاء الأزرار)
                btn.style.opacity = "0";
                btn.style.transform = "translateY(20px)";
                btn.style.pointerEvents = "none";
                
                btn.onclick = () => {
                    if(!canClick || hasAnswered) return;
                    hasAnswered = true;
                    clearInterval(questionTimerInterval); 
                    
                    const allBtns = container.querySelectorAll('.option-btn');
                    allBtns.forEach(b => {
                        b.disabled = true;
                        if(b.dataset.correct === 'true') {
                            b.classList.add('correct');
                        }
                    });
                    
                    if (!opt.correct) {
                        btn.classList.add('wrong');
                        currentStreak = 0; 
                        document.getElementById('streak-indicator').classList.add('hidden');
                        playSound('wrong');
                    } else {
                        currentStreak++;
                        let points = 10;
                        if(currentStreak >= 3) {
                            points = 15;
                            document.getElementById('streak-indicator').classList.remove('hidden');
                            document.getElementById('streak-count').textContent = currentStreak;
                        }
                        myScore += points;
                        playSound('correct');
                    }
                    
                    document.getElementById('waiting-opponent').classList.remove('hidden');
                    document.getElementById('waiting-opponent').style.color = "#f1c40f";
                    
                    if (gameMode === 'single') {
                        document.getElementById('waiting-opponent').innerHTML = "✅ تمت الإجابة!";
                    } else if (gameMode === '1v1' || gameMode === 'matchmaking') {
                        document.getElementById('waiting-opponent').innerHTML = "في انتظار إجابة الخصم أو انتهاء وقته...";
                    } else if (gameMode === 'group' && isHost) {
                        document.getElementById('waiting-opponent').innerHTML = "بصفتك المدير: اضغط 'انتقال' حينما يكتمل الوقت.";
                        document.getElementById('btn-next-q').style.display = 'block';
                    } else {
                        document.getElementById('waiting-opponent').innerHTML = "في انتظار المعلم للانتقال للسؤال التالي...";
                    }
                    
                    updateDoc(doc(db,'rooms',roomId), {
                        [`players.${myUid}.answers.q_${idx}`]: true, 
                        [`players.${myUid}.score`]: myScore
                    });
                };
                buttons.push(btn);
                container.appendChild(btn);
            });

            // بدء العداد التنازلي والمراحل
            questionTimerInterval = setInterval(() => {
                if (hasAnswered) { clearInterval(questionTimerInterval); return; }
                
                // 1. مرحلة القراءة (الغمامة)
                if (readingTime > 0) {
                    readingTime--;
                    const readTimerEl = document.getElementById('read-timer');
                    if (readTimerEl) readTimerEl.textContent = readingTime;

                    // انتهاء وقت القراءة وبدء ظهور الإجابات
                    if (readingTime === 0) {
                        document.getElementById('waiting-opponent').innerHTML = "🔥 اختر الإجابة الصحيحة الآن! 🔥";
                        
                        // ظهور الأزرار تدريجياً (إجابة تلو الأخرى)
                        buttons.forEach((btn, index) => {
                            setTimeout(() => {
                                btn.style.opacity = "1";
                                btn.style.transform = "translateY(0)";
                            }, index * 400); // تأخير 400 مللي ثانية بين كل زر
                        });

                        // السماح بالضغط بعد ظهور كل الأزرار
                        setTimeout(() => {
                            canClick = true;
                            buttons.forEach(b => b.style.pointerEvents = "auto");
                        }, buttons.length * 400);
                    }
                }

                // العداد الأصلي مستمر في النزول
                timeLeft--;
                timerText.textContent = `⏳ ${timeLeft} ثانية`;
                timerBar.style.width = `${(timeLeft / 30) * 100}%`;

                if (timeLeft <= 10) timerBar.style.background = '#e74c3c';
                if (timeLeft <= 5 && timeLeft > 0) playSound('tick');

                if (timeLeft <= 0) {
                    clearInterval(questionTimerInterval);
                    hasAnswered = true;
                    canClick = false;
                    
                    currentStreak = 0;
                    document.getElementById('streak-indicator').classList.add('hidden');
                    playSound('wrong');
                    
                    const allBtns = container.querySelectorAll('.option-btn');
                    allBtns.forEach(b => {
                        b.style.pointerEvents = "none";
                        if(b.dataset.correct === 'true') b.classList.add('correct');
                    });
                    
                    document.getElementById('waiting-opponent').classList.remove('hidden');
                    document.getElementById('waiting-opponent').innerHTML = "⏰ انتهى الوقت! (إجابة ضائعة)";
                    document.getElementById('waiting-opponent').style.color = "#e74c3c";
                    
                    updateDoc(doc(db,'rooms',roomId), {
                        [`players.${myUid}.answers.q_${idx}`]: true, 
                        [`players.${myUid}.score`]: myScore
                    });
                }
            }, 1000);
        }

        function endGame(data) {
            clearInterval(questionTimerInterval); 
            
            document.getElementById('emoji-toggle-btn').style.display = 'none';
            document.getElementById('emoji-panel').classList.add('closed');
            
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const finalLb = document.getElementById('final-leaderboard');
            finalLb.innerHTML = '';

            let resultMessageForTeacher = "";

            if (gameMode === 'single') {
                document.getElementById('final-title').textContent = "🎉 تدريب رائع!";
                finalLb.innerHTML = `<div>نتيجتك النهائية: <span style="color:#fdbb2d">${myScore}</span> نقطة</div>`;
                if(myScore > 0 && isHost) postToFeed(`الطالب ${myName} أكمل تدريباً فردياً وحصل على ${myScore} نقطة! 👏`);
                
                resultMessageForTeacher = `مرحباً معلمي! 🎓\nأنا الطالب: *${myName}*\nلقد أتممت التدريب الفردي للدرس وحصلت على نتيجة: *${myScore}* نقطة! 🏆\n(عبر منصة Borooj Way) 🚀`;
                document.getElementById('teacher-share-section').classList.remove('hidden');

            } else if (gameMode === '1v1' || gameMode === 'matchmaking') {
                const oppScore = data.players[opponentUid] ? data.players[opponentUid].score : 0;
                const oppName = data.players[opponentUid] ? data.players[opponentUid].displayName : "الخصم";
                document.getElementById('final-title').textContent = myScore > oppScore ? "🏆 فزت!" : (myScore < oppScore ? "💔 خسرت" : "🤝 تعادل");
                finalLb.innerHTML = `<div>أنت: ${myScore}</div><div>الخصم: ${oppScore}</div>`;
                
                if(isHost) {
                    if(myScore > oppScore) postToFeed(`عاجل 🚨: البطل ${myName} هزم ${oppName} بنتيجة ${myScore} - ${oppScore} 🔥`);
                    else if (myScore < oppScore) postToFeed(`عاجل 🚨: البطل ${oppName} هزم ${myName} بنتيجة ${oppScore} - ${myScore} 🔥`);
                    else postToFeed(`تعادل مثير بين ${myName} و ${oppName} بنتيجة ${myScore} لكل منهما 🤝`);
                }

                resultMessageForTeacher = `مرحباً معلمي! 🎓\nأنا الطالب: *${myName}*\nلقد لعبت تحدياً مباشراً وحصلت على: *${myScore}* نقطة، بينما حصل خصمي على: *${oppScore}* نقطة! ⚔️\n(عبر منصة Borooj Way) 🚀`;
                document.getElementById('teacher-share-section').classList.remove('hidden');

            } else {
                document.getElementById('final-title').textContent = "🏆 الترتيب النهائي 🏆";
                const playersArray = Object.values(data.players || {}).sort((a,b) => b.score - a.score);
                playersArray.forEach((p, index) => {
                    if(p.uid === data.hostUid) return; 
                    let medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : '🔸'));
                    const pTeamStrFinal = getTeamHtml(p.team, 25);
                    finalLb.innerHTML += `<div>${medal} ${pTeamStrFinal} ${p.avatar || '👤'} ${p.displayName}: <span style="color:#fdbb2d">${p.score} نقطة</span></div>`;
                });
                
                if(isHost && playersArray.length > 0) {
                    const topPlayer = playersArray[0];
                    if (topPlayer.uid !== data.hostUid) postToFeed(`عاجل 🚨: ${topPlayer.displayName} اكتسح التحدي الجماعي واحتل المركز الأول بـ ${topPlayer.score} نقطة! 👑`);
                }
            }

            document.getElementById('btn-submit-academic').onclick = async () => {
                const teacherId = sessionStorage.getItem('teacherCode');
                const btn = document.getElementById('btn-submit-academic');
                btn.disabled = true;
                btn.textContent = "جاري الإرسال... ⏳";
                
                try {
                    await addDoc(collection(db, "academic_results"), {
                        studentName: myName,
                        studentUid: myUid,
                        score: myScore,
                        lessonId: window.lessonTitleForMsg || "درس غير محدد",
                        teacherId: teacherId || "بدون كود",
                        timestamp: new Date(),
                        mode: gameMode
                    });
                    btn.textContent = "تم تسليم النتيجة لمعلمك بنجاح ✅";
                    btn.style.background = "#27ae60";
                } catch (e) { 
                    console.error(e);
                    btn.textContent = "خطأ في الإرسال، حاول مرة أخرى";
                    btn.disabled = false;
                }
            };

            document.getElementById('btn-send-whatsapp').onclick = () => {
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(resultMessageForTeacher)}`;
                window.open(whatsappUrl, '_blank');
            };
            
            if(typeof confetti === "function") {
                setTimeout(() => { confetti({ particleCount: 300, spread: 100, origin: { y: 0.5 } }); }, 500);
            }
        }

        window.kickStudent = async (uid) => {
            if(confirm("هل أنت متأكد من طرد هذا الطالب نهائياً من الغرفة؟")) {
                await updateDoc(doc(db, 'rooms', roomId), { [`players.${uid}`]: deleteField() });
            }
        };

        window.warnStudent = async (uid) => {
            await updateDoc(doc(db, 'rooms', roomId), { lastWarning: { targetUid: uid, time: Date.now() } });
        };

        const btnForceNext = document.getElementById('btn-admin-force-next');
        if(btnForceNext) {
            btnForceNext.onclick = async () => {
                await updateDoc(doc(db, 'rooms', roomId), { currentQuestionIndex: currentQIdx + 1 });
            };
        }

        onAuthStateChanged(auth, (user) => {
            if (user) initBattle();
            else window.location.href = "login.html";
        });
    </script>

                layout: google.translate.TranslateElement.InlineLayout.SIMPLE 
            }, 'google_translate_element'); 
        }
    </script>
