];
        function showLessons(gradeName, lessons) {
            const container = document.getElementById('lessonsContainer');
            document.getElementById('modalTitle').innerText = gradeName;
            container.innerHTML = '';

            if (lessons.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px;">جاري رفع ملفات الباوربوينت لهذا الصف قريباً...</p>';
            } else {
                lessons.forEach(lesson => {
                    if (lesson.type === 'unit') {
                        const h = document.createElement('div');
                        h.className = 'unit-header';
                        h.innerText = lesson.title;
                        container.appendChild(h);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'lesson-card';
                        
                        card.innerHTML = `
                            <span class="lesson-title-main">${lesson.titleAr}</span>
                            <div class="download-row">
                                <a href="download.html?url=${encodeURIComponent(lesson.linkAr)}" class="download-box ar-box">
                                    <span class="lang-label ar-label">العربية</span>
                                    <span class="lesson-name">${lesson.titleAr}</span>
                                </a>
                                <a href="download.html?url=${encodeURIComponent(lesson.linkEn)}" class="download-box en-box" dir="ltr">
                                    <span class="lang-label en-label">English</span>
                                    <span class="lesson-name">${lesson.titleEn}</span>
                                </a>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });
            }
            document.getElementById('lessonModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('lessonModal').style.display = 'none'; }
        window.onclick = function(event) { if (event.target.className === 'modal') closeModal(); }
